# Publica el juego en GitHub Pages en cada push a main: importa el proyecto, pasa los tests,
# exporta la version web de un solo hilo, comprueba la salida y la despliega.
# Seguridad: acciones oficiales fijadas por hash de commit, permisos minimos (solo lectura salvo
# el trabajo de despliegue), Godot y sus plantillas comprobados contra las sumas SHA-512
# oficiales escritas aqui, y nada de secretos ni dependencias de Python en el servidor.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    # bash con -e y -o pipefail: cualquier fallo, tambien dentro de una tuberia, detiene el trabajo.
    shell: bash

concurrency:
  group: pages
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2-stable
  GODOT_RELEASE: https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable
  # Sumas de SHA512-SUMS.txt de la version 4.7.2-stable de godotengine/godot-builds.
  GODOT_EDITOR_SHA512: 9aa00f7a605200940bce3027a567b782f49bd8e940dd06ae9e987bd65aee1b1467edd56ed84fcdcbdd44354bf613bdbb4e5d2913e925850368e150c59ed54c65
  GODOT_TEMPLATES_SHA512: ca4d71c4d7b81dfc15d1a98baa07534aa95b03fdda78a0075b06672e1648d2e5f40980c9adc28d23e1b92e732ee7bf3461997aa804af74ec2fcd7a93ccb84079

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Buscar claves en el repositorio
        # Se excluyen los dos archivos que contienen los propios patrones de busqueda.
        run: |
          if git grep -nIE 'BEGIN (RSA |EC |OPENSSH |)PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|github_pat_|sk-[A-Za-z0-9]{20,}|xox[baprs]-|AIza[0-9A-Za-z_-]{35}' -- . ':!tools/verify.ps1' ':!.github/workflows/pages.yml'; then
            echo "::error::posible clave en el repositorio"; exit 1
          fi

      - name: Recuperar Godot de la cache
        id: godot-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/godot-dl
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_EDITOR_SHA512 }}-${{ env.GODOT_TEMPLATES_SHA512 }}

      - name: Descargar Godot y las plantillas web
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-dl
          cd ~/godot-dl
          curl -fsSL --retry 3 -o editor.zip "$GODOT_RELEASE/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fsSL --retry 3 -o templates.tpz "$GODOT_RELEASE/Godot_v${GODOT_VERSION}_export_templates.tpz"

      - name: Comprobar las sumas SHA-512 (tambien lo que venga de la cache)
        run: |
          cd ~/godot-dl
          echo "$GODOT_EDITOR_SHA512  editor.zip" | sha512sum --check --strict
          echo "$GODOT_TEMPLATES_SHA512  templates.tpz" | sha512sum --check --strict

      - name: Instalar Godot y solo la plantilla web de un solo hilo
        run: |
          mkdir -p ~/godot "$HOME/.local/share/godot/export_templates/${GODOT_VERSION/-/.}"
          unzip -q ~/godot-dl/editor.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}_linux.x86_64 ~/godot/godot
          unzip -q -j ~/godot-dl/templates.tpz "templates/web_nothreads_release.zip" "templates/version.txt" \
            -d "$HOME/.local/share/godot/export_templates/${GODOT_VERSION/-/.}"
          ~/godot/godot --version

      - name: Importar el proyecto
        run: ~/godot/godot --headless --path . --import

      - name: Tests
        run: |
          ~/godot/godot --headless --path . -s addons/gut/gut_cmdln.gd 2>&1 | tee gut.log
          if grep -Eq 'Nothing was run|Ignoring script|\[GUT ERROR\]|\[Failed\]' gut.log; then
            echo "::error::los tests fallaron"; exit 1
          fi
          grep -q 'All tests passed' gut.log || { echo "::error::no se confirmo que pasaran los tests"; exit 1; }

      - name: Exportar la version web
        run: |
          mkdir -p build/web
          touch build/.gdignore
          ~/godot/godot --headless --path . --export-release Web build/web/index.html
          cp web/boot.js web/boot.css build/web/
          ~/godot/godot --headless --path . -s res://tools/notices.gd -- build/web/LICENCIAS.txt
          test -s build/web/index.pck && test -s build/web/index.wasm && test -s build/web/LICENCIAS.txt

      - name: Comprobar la salida (secretos, direcciones externas y scripts en linea)
        run: |
          cd build/web
          if ls *.import >/dev/null 2>&1; then echo "::error::archivos del editor en la salida"; exit 1; fi
          if grep -EIl 'BEGIN (RSA |EC |OPENSSH |)PRIVATE KEY|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{36}|github_pat_|sk-[A-Za-z0-9]{20,}|xox[baprs]-|AIza[0-9A-Za-z_-]{35}' *.html *.js *.css; then
            echo "::error::posible secreto en la salida"; exit 1
          fi
          if grep -El 'https?://' index.html boot.js boot.css; then
            echo "::error::direccion externa en la pagina"; exit 1
          fi
          if grep -Eiq 'api[_-]?key|secret|passw|bearer|token' index.html boot.js boot.css; then
            echo "::error::palabra sensible en la pagina"; exit 1
          fi
          if grep -Pq '<script>|<script(?![^>]*\ssrc=)[^>]*>|\son[a-z]+\s*=' index.html; then
            echo "::error::scripts o manejadores en linea en index.html"; exit 1
          fi
          grep -q "Content-Security-Policy" index.html || { echo "::error::falta la CSP"; exit 1; }

      - name: Preparar Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Subir la version web
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
